<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc" lang="ru"><title id="title">Инструменты: от запроса к действию</title><desc id="desc">Модель выбирает инструмент, приложение выполняет его и возвращает результат в контекст. Затем модель выбирает следующий шаг с учётом правил.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#6083a0"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;text-anchor:middle;fill:#203a35}.title{font-size:24px;font-weight:500}.sub{font-size:19px;fill:#56655e}</style><rect x="1" y="1" width="998" height="848" rx="18" fill="#fcfbf7" stroke="#dedfd5"/><path d="M500 132V186" fill="none" stroke="#6083a0" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 292V346" fill="none" stroke="#6083a0" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 452V506" fill="none" stroke="#6083a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="30" width="850" height="100" rx="16" fill="#f1f2e9" stroke="#dedfd5" stroke-width="2"/><text x="500.0" y="69" class="title">Запрос пользователя</text><text x="500.0" y="103" class="sub">«Хочу вернуть деньги за заказ #12345»</text><rect x="75" y="190" width="850" height="100" rx="16" fill="#e3edf5" stroke="#90b1cb" stroke-width="2"/><text x="500.0" y="229" class="title">Модель Claude</text><text x="500.0" y="263" class="sub">Выбирает lookup_order</text><rect x="75" y="350" width="850" height="100" rx="16" fill="#e5f1e9" stroke="#8ab9a4" stroke-width="2"/><text x="500.0" y="389" class="title">Приложение выполняет lookup_order</text><text x="500.0" y="423" class="sub">purchase_age_days: 45</text><rect x="515" y="463" width="420" height="32" fill="#fcfbf7"/><text x="720" y="486" class="sub">Результат инструмента добавлен в контекст</text><rect x="75" y="510" width="850" height="100" rx="16" fill="#e3edf5" stroke="#90b1cb" stroke-width="2"/><text x="500.0" y="549" class="title">Модель Claude</text><text x="500.0" y="583" class="sub">Оценивает правила возврата и данные заказа</text><path d="M500 612V654H280V704M500 654H720V704" fill="none" stroke="#6083a0" stroke-width="3"/><path d="M280 680V704M720 680V704" stroke="#6083a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="710" width="410" height="100" rx="16" fill="#e5f1e9" stroke="#8ab9a4" stroke-width="2"/><text x="280.0" y="749" class="title">process_refund</text><text x="280.0" y="783" class="sub">Если возврат разрешён</text><rect x="515" y="710" width="410" height="100" rx="16" fill="#faf0d9" stroke="#d1ad70" stroke-width="2"/><text x="720.0" y="749" class="title">escalate_to_human</text><text x="720.0" y="783" class="sub">Если нужна проверка</text></svg>