<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc" lang="en"><title id="title">From authorization boundary to human review</title><desc id="desc">Read-only tools gather the facts; a restricted action waits for a manager’s decision.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#6083a0"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;text-anchor:middle;fill:#203a35}.title{font-size:24px;font-weight:500}.sub{font-size:19px;fill:#56655e}</style><rect x="1" y="1" width="998" height="848" rx="18" fill="#fcfbf7" stroke="#dedfd5"/><rect x="60" y="25" width="880" height="100" rx="16" fill="#f1f2e9" stroke="#dedfd5" stroke-width="2"/><text x="500.0" y="64" class="title">Customer request</text><text x="500.0" y="98" class="sub">Billing dispute</text><path d="M500 127V155H275V190M500 155H725V190" fill="none" stroke="#6083a0" stroke-width="3"/><path d="M275 175V190M725 175V190" stroke="#6083a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="195" width="430" height="100" rx="16" fill="#e5f1e9" stroke="#8ab9a4" stroke-width="2"/><text x="275.0" y="234" class="title">get_customer</text><text x="275.0" y="268" class="sub">Customer details</text><rect x="510" y="195" width="430" height="100" rx="16" fill="#e5f1e9" stroke="#8ab9a4" stroke-width="2"/><text x="725.0" y="234" class="title">lookup_order</text><text x="725.0" y="268" class="sub">Order details</text><path d="M275 297V325H725V297M500 325V360" fill="none" stroke="#6083a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="365" width="880" height="100" rx="16" fill="#faf0d9" stroke="#d1ad70" stroke-width="2"/><text x="500.0" y="404" class="title">Authorization boundary</text><text x="500.0" y="438" class="sub">Manager approval required</text><path d="M500 467V525M500 652V715" stroke="#6083a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="530" width="880" height="120" rx="16" fill="#e3edf5" stroke="#90b1cb" stroke-width="2"/><text x="500.0" y="569" class="title">Structured handoff</text><text x="500.0" y="603" class="sub">Customer ID + Order ID + Pricing error</text><text x="500" y="635" class="sub">Reason for escalation + Recommended action</text><rect x="60" y="720" width="880" height="100" rx="16" fill="#e5f1e9" stroke="#8ab9a4" stroke-width="2"/><text x="500.0" y="759" class="title">escalate_to_human</text><text x="500.0" y="793" class="sub">Manager reviews and approves or rejects</text></svg>