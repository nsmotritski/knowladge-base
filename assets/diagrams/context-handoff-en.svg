<rect x="1" y="1" width="998" height="848" rx="16" fill="#fcfbf7" stroke="#dedfd5"/>
<g fill="none" stroke-width="3" stroke-linejoin="round">
<path d="M390 160V320" stroke="#6083a0" marker-end="url(#blue)"/>
<path d="M610 320V160" stroke="#29866e" marker-end="url(#green)"/>
<path d="M760 100H920V580H760" stroke="#6083a0" marker-end="url(#blue)"/>
<path d="M240 580H80V100H240" stroke="#29866e" marker-end="url(#green)"/>
